<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>新闻采集管理后台</title>
<!--
  新闻采集系统 · 内置管理端（单文件）
  ------------------------------------------------------------------
  约定（详见 docs/api.md 三、管理端 /admin/api/**）：
   1) 所有接口同源相对路径，无任何 CDN / 外部依赖，离线可用；
   2) 表单参数 application/x-www-form-urlencoded（URLSearchParams）；
   3) 鉴权 Header：X-Admin-Token: <token>（登录接口除外）；
   4) 统一响应体 {code,msg,data}，code!==0 视为失败并提示；
   5) HTTP 401 或 code=1000/1 → 清除 token 回到登录页。
-->
<style>
/* ================================================================
 * 样式区（纯 CSS，无第三方 UI 库）
 * ================================================================ */
* { box-sizing: border-box; }
:root {
  --primary: #2563eb;
  --primary-dark: #1d4ed8;
  --sidebar-bg: #1f2a37;
  --sidebar-fg: #cbd5e1;
  --sidebar-active: #2563eb;
  --bg: #f4f6fa;
  --panel: #ffffff;
  --border: #e5e9f0;
  --text: #1f2937;
  --muted: #8b96a5;
  --green: #16a34a;
  --amber: #d97706;
  --red: #dc2626;
  --radius: 8px;
}
html, body { height: 100%; }
body {
  margin: 0;
  font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
  font-size: 13px;
  color: var(--text);
  background: var(--bg);
}
button, input, select, textarea { font-family: inherit; font-size: 13px; }
a { color: var(--primary); text-decoration: none; }
.hidden { display: none !important; }

/* ---------------- 登录页 ---------------- */
.login-wrap {
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, #1f2a37 0%, #2b3b52 60%, #2563eb 100%);
}
.login-card {
  width: 360px; padding: 32px 30px 26px;
  background: #fff; border-radius: 12px;
  box-shadow: 0 18px 50px rgba(15, 23, 42, .35);
}
.login-card h1 { margin: 0 0 6px; font-size: 20px; letter-spacing: 1px; }
.login-card .sub { margin: 0 0 22px; color: var(--muted); font-size: 12px; }
.login-card .field { display: block; margin-bottom: 14px; }
.login-card .field span { display: block; margin-bottom: 6px; color: #475569; }
.login-card input {
  width: 100%; height: 36px; padding: 0 10px;
  border: 1px solid var(--border); border-radius: 6px; outline: none;
}
.login-card input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,.12); }
.login-tip { min-height: 18px; margin-top: 10px; color: var(--red); font-size: 12px; }

/* ---------------- 主框架：左侧菜单 + 右侧内容 ---------------- */
.app { display: flex; min-height: 100vh; }
.sidebar {
  width: 196px; flex: 0 0 196px; background: var(--sidebar-bg); color: var(--sidebar-fg);
  display: flex; flex-direction: column;
}
.brand {
  height: 56px; line-height: 56px; padding: 0 16px;
  color: #fff; font-size: 15px; font-weight: 600; letter-spacing: .5px;
  border-bottom: 1px solid rgba(255,255,255,.08); white-space: nowrap;
}
.brand small { display: block; line-height: 1; margin-top: -18px; font-size: 10px; color: #94a3b8; font-weight: 400; }
.nav { padding: 8px 0; flex: 1; }
.nav-item {
  display: flex; align-items: center; gap: 8px;
  height: 40px; padding: 0 16px; cursor: pointer; color: var(--sidebar-fg);
  border-left: 3px solid transparent; user-select: none; white-space: nowrap;
}
.nav-item:hover { background: rgba(255,255,255,.06); color: #fff; }
.nav-item.active { background: rgba(37,99,235,.20); border-left-color: var(--sidebar-active); color: #fff; }
.nav-item .ico { width: 16px; text-align: center; }
.sidebar-foot { padding: 10px 16px; font-size: 11px; color: #64748b; border-top: 1px solid rgba(255,255,255,.08); }

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar {
  height: 56px; flex: 0 0 56px; background: #fff; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between; padding: 0 18px;
}
.topbar h2 { margin: 0; font-size: 16px; font-weight: 600; }
.topbar .user { display: flex; align-items: center; gap: 10px; color: #475569; }
.avatar-dot {
  width: 26px; height: 26px; border-radius: 50%; background: var(--primary); color: #fff;
  display: inline-flex; align-items: center; justify-content: center; font-size: 12px;
}
.content { flex: 1; padding: 16px 18px 26px; overflow: auto; }
.page { display: none; }
.page.active { display: block; }

/* ---------------- 通用组件 ---------------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 4px;
  height: 30px; padding: 0 12px; border: 1px solid var(--border); border-radius: 6px;
  background: #fff; color: #334155; cursor: pointer; white-space: nowrap;
}
.btn:hover { border-color: #c7d2e0; background: #f8fafc; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-dark); border-color: var(--primary-dark); }
.btn-danger { color: var(--red); border-color: #f3c7c7; }
.btn-danger:hover { background: #fef2f2; }
.btn-sm { height: 26px; padding: 0 8px; font-size: 12px; }
.btn-block { width: 100%; height: 36px; }
.btn-link { border: none; background: none; color: var(--primary); padding: 0 4px; height: 26px; }
.btn-link.danger { color: var(--red); }

.panel {
  background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
  margin-bottom: 14px;
}
.panel-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 14px; border-bottom: 1px solid var(--border);
}
.panel-head h3 { margin: 0; font-size: 14px; }
.panel-body { padding: 14px; }
.muted { color: var(--muted); }
.spacer { flex: 1; }

.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 12px 14px; }
.toolbar select, .toolbar input {
  height: 30px; padding: 0 8px; border: 1px solid var(--border); border-radius: 6px; background: #fff; outline: none;
}
.toolbar input:focus, .toolbar select:focus { border-color: var(--primary); }
.toolbar .label { color: #64748b; }

.field { display: block; margin-bottom: 12px; }
.field > span { display: block; margin-bottom: 5px; color: #475569; }
.field input, .field select, .field textarea {
  width: 100%; padding: 6px 9px; border: 1px solid var(--border); border-radius: 6px;
  outline: none; background: #fff;
}
.field input, .field select { height: 32px; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,.10); }
.field textarea.mono { font-family: Consolas, "Courier New", monospace; font-size: 12px; line-height: 1.6; resize: vertical; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; column-gap: 14px; }

.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--border); vertical-align: middle; }
th { background: #f8fafc; color: #475569; font-weight: 600; white-space: nowrap; }
tbody tr:hover { background: #f8fbff; }
td.empty { text-align: center; color: var(--muted); padding: 34px 0; }
td.op { white-space: nowrap; }
.trunc { display: inline-block; max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: middle; }
.trunc.url { max-width: 220px; font-family: Consolas, monospace; font-size: 12px; color: #475569; }
.nowrap { white-space: nowrap; }

.badge {
  display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11px; line-height: 18px;
  background: #eef2f7; color: #64748b; border: 1px solid #e2e8f0;
}
.badge-green { background: #e8f7ee; color: var(--green); border-color: #c6ecd5; }
.badge-amber { background: #fdf3e3; color: var(--amber); border-color: #f6e0bd; }
.badge-red { background: #fdeceb; color: var(--red); border-color: #f7cfcc; }
.badge-blue { background: #e8f0fe; color: var(--primary); border-color: #cfe0fb; }

.pager { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 12px; }
.pager-info { color: #64748b; }

/* ---------------- 数据看板 ---------------- */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); gap: 12px; margin-bottom: 14px; }
.card {
  background: #fff; border: 1px solid var(--border); border-radius: var(--radius);
  padding: 12px 14px;
}
.card .k { color: var(--muted); font-size: 12px; }
.card .v { font-size: 24px; font-weight: 600; margin-top: 6px; line-height: 1.1; }
.card .v.blue { color: var(--primary); }
.card .v.amber { color: var(--amber); }
.card .v.green { color: var(--green); }
.card .v.red { color: var(--red); }

.bars { padding: 6px 14px 16px; }
.bar-row { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
.bar-name { width: 104px; flex: 0 0 104px; color: #475569; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-track { flex: 1; height: 16px; background: #eef2f7; border-radius: 8px; overflow: hidden; }
.bar-fill { height: 100%; background: linear-gradient(90deg, #60a5fa, #2563eb); border-radius: 8px; min-width: 2px; transition: width .25s; }
.bar-count { width: 52px; flex: 0 0 52px; text-align: right; color: #64748b; }

/* ---------------- 弹窗（自写 modal） ---------------- */
.modal-mask {
  position: fixed; inset: 0; background: rgba(15, 23, 42, .45);
  display: flex; align-items: flex-start; justify-content: center; z-index: 1000;
  padding: 40px 16px; overflow: auto;
}
.modal {
  width: 100%; max-width: 720px; background: #fff; border-radius: 10px;
  box-shadow: 0 20px 50px rgba(15,23,42,.35); display: flex; flex-direction: column;
  max-height: calc(100vh - 80px);
}
.modal-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px; border-bottom: 1px solid var(--border);
}
.modal-head h3 { margin: 0; font-size: 15px; }
.modal-body { padding: 16px; overflow: auto; }
.modal-foot {
  display: flex; justify-content: flex-end; gap: 8px;
  padding: 12px 16px; border-top: 1px solid var(--border);
}
.icon-btn { border: none; background: none; cursor: pointer; color: var(--muted); font-size: 15px; line-height: 1; }
.icon-btn:hover { color: var(--text); }
.ai-box { border: 1px dashed #cfe0fb; background: #f7faff; border-radius: 6px; padding: 10px 12px; margin-bottom: 12px; }
.ai-box .t { color: var(--primary); font-weight: 600; margin-bottom: 6px; }
.ai-box .r { display: flex; gap: 6px; margin-top: 4px; color: #475569; word-break: break-all; }
.ai-box .r b { flex: 0 0 68px; color: #64748b; font-weight: 400; }

/* ---------------- 轻提示 toast ---------------- */
#toast-box { position: fixed; top: 16px; right: 16px; z-index: 2000; display: flex; flex-direction: column; gap: 8px; }
.toast {
  min-width: 160px; max-width: 320px; padding: 9px 13px; border-radius: 6px;
  background: #1f2937; color: #fff; box-shadow: 0 8px 24px rgba(15,23,42,.3);
  animation: toastIn .18s ease-out;
}
.toast.ok { background: #15803d; }
.toast.err { background: #b91c1c; }
@keyframes toastIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }

/* 小屏幕（含 1366×768 之下的窗口）自适应 */
@media (max-width: 900px) {
  .sidebar { width: 150px; flex: 0 0 150px; }
  .brand { font-size: 13px; }
  .grid-2 { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<!-- ============================ 登录视图 ============================ -->
<div id="login-view" class="login-wrap hidden">
  <form class="login-card" id="login-form" autocomplete="off">
    <h1>新闻采集管理后台</h1>
    <p class="sub">News Collector · 内置管理端</p>
    <label class="field">
      <span>手机号</span>
      <input id="login-mobile" name="mobile" type="text" placeholder="请输入管理员手机号">
    </label>
    <label class="field">
      <span>密码</span>
      <input id="login-password" name="password" type="password" placeholder="请输入密码">
    </label>
    <button type="submit" class="btn btn-primary btn-block" id="login-btn">登 录</button>
    <div class="login-tip" id="login-tip"></div>
  </form>
</div>

<!-- ============================ 主框架 ============================ -->
<div id="app-view" class="app hidden">
  <!-- 左侧菜单 -->
  <aside class="sidebar">
    <div class="brand">新闻采集系统<small>Admin Console</small></div>
    <nav class="nav" id="nav">
      <a class="nav-item active" data-action="nav" data-page="dashboard"><span class="ico">▦</span>数据看板</a>
      <a class="nav-item" data-action="nav" data-page="news"><span class="ico">▤</span>新闻管理</a>
      <a class="nav-item" data-action="nav" data-page="banner"><span class="ico">▣</span>轮播管理</a>
      <a class="nav-item" data-action="nav" data-page="source"><span class="ico">◎</span>采集源</a>
      <a class="nav-item" data-action="nav" data-page="logs"><span class="ico">≡</span>采集日志</a>
      <a class="nav-item" data-action="nav" data-page="user"><span class="ico">☺</span>用户管理</a>
    </nav>
    <div class="sidebar-foot">课程作业 · 演示版本</div>
  </aside>

  <!-- 右侧内容 -->
  <div class="main">
    <header class="topbar">
      <h2 id="page-title">数据看板</h2>
      <div class="user">
        <span class="avatar-dot">管</span>
        <span id="top-nickname">管理员</span>
        <button class="btn btn-sm" data-action="logout">退出</button>
      </div>
    </header>
    <main class="content">
      <section class="page active" id="page-dashboard"></section>
      <section class="page" id="page-news"></section>
      <section class="page" id="page-banner"></section>
      <section class="page" id="page-source"></section>
      <section class="page" id="page-logs"></section>
      <section class="page" id="page-user"></section>
    </main>
  </div>
</div>

<div id="toast-box"></div>

<script>
/* ================================================================
 * 区块 1：全局状态管理
 * ================================================================ */
const LS_TOKEN = 'nc_admin_token';
const LS_NAME  = 'nc_admin_nickname';

// 视为“登录失效”的业务码：1000=请先登录；按课程要求 code=1 一并按失效处理
const UNAUTH_CODES = [1000, 1];

// 页面中文标题
const PAGE_TITLES = {
  dashboard: '数据看板',
  news: '新闻管理',
  banner: '轮播管理',
  source: '采集源管理',
  logs: '采集日志',
  user: '用户管理'
};

const state = {
  token: localStorage.getItem(LS_TOKEN) || '',
  nickname: localStorage.getItem(LS_NAME) || '管理员',
  page: 'dashboard',
  built: {},                       // 各页面骨架是否已构建
  categories: [],                  // 频道缓存：GET /admin/api/category
  news:   { page: 1, size: 10, total: 0, list: [], filter: { status: '', category_id: '', ai_status: '', keyword: '' } },
  logs:   { page: 1, size: 10, total: 0, list: [] },
  users:  { page: 1, size: 10, total: 0, list: [], keyword: '' }
};

/* ================================================================
 * 区块 2：请求封装（fetch + 统一响应体 + 鉴权失效处理）
 * ================================================================ */
/**
 * 参数序列化
 * keepEmpty=false（GET / query）：空值不传，避免出现 status= 这类空筛选条件；
 * keepEmpty=true （POST 表单体）   ：保留空串，这样编辑弹窗里「清空某个字段」才能真正提交上去。
 * undefined / null 一律不传。
 */
function toSearchParams(params, keepEmpty) {
  const sp = new URLSearchParams();
  Object.keys(params || {}).forEach(function (k) {
    const v = params[k];
    if (v === undefined || v === null) return;
    if (!keepEmpty && v === '') return;
    sp.append(k, v);
  });
  return sp;
}

/**
 * 统一请求方法（同源相对路径，绝不请求外部资源）
 * @param {string} method  'GET' | 'POST'
 * @param {string} path    形如 '/admin/api/news'
 * @param {object} params  参数对象
 * @param {object} opts    { query:true } 时 POST 也把参数拼到 URL（用于 ai/backfill、ai/regenerate）
 */
async function api(method, path, params, opts) {
  opts = opts || {};
  let url = path;
  const headers = {};
  if (state.token) headers['X-Admin-Token'] = state.token;

  let body = null;
  if (method === 'GET' || opts.query) {
    const s = toSearchParams(params, false).toString();
    if (s) url += (url.indexOf('?') >= 0 ? '&' : '?') + s;
  } else {
    headers['Content-Type'] = 'application/x-www-form-urlencoded;charset=UTF-8';
    body = toSearchParams(params, true).toString();   // 表单体：保留空串（支持清空字段）
  }

  let res;
  try {
    res = await fetch(url, { method: method, headers: headers, body: body, credentials: 'same-origin' });
  } catch (e) {
    throw new Error('网络请求失败（' + e.message + '）');
  }

  // HTTP 401 → token 失效
  if (res.status === 401) {
    handleUnauth('登录状态已失效，请重新登录');
    throw mkUnauthError('登录状态已失效');
  }

  const text = await res.text();
  let json = null;
  try { json = text ? JSON.parse(text) : null; }
  catch (e) { throw new Error('响应不是合法 JSON（HTTP ' + res.status + '）'); }

  // 统一响应体 { code, msg, data }
  if (json && typeof json === 'object' && 'code' in json) {
    const code = Number(json.code);
    if (code === 0) return json.data;
    if (UNAUTH_CODES.indexOf(code) >= 0) {
      const m = json.msg || '登录状态已失效，请重新登录';
      handleUnauth(m);
      throw mkUnauthError(m);
    }
    throw new Error(json.msg || ('请求失败（code=' + json.code + '）'));
  }
  if (!res.ok) throw new Error('请求失败（HTTP ' + res.status + '）');
  return json;   // 兼容直接返回裸数据的情况
}

function mkUnauthError(msg) {
  const e = new Error(msg);
  e.unauth = true;
  return e;
}

// 登录失效：清 token → 回登录页
function handleUnauth(msg) {
  state.token = '';
  localStorage.removeItem(LS_TOKEN);
  localStorage.removeItem(LS_NAME);
  toast(msg || '登录状态已失效', 'err');
  showLogin();
}

/** 统一写操作：confirm 二次确认 → 执行 → 提示 → 回调刷新 */
async function writeOp(confirmText, fn, after) {
  if (!confirm(confirmText)) return;
  try {
    const data = await fn();
    toast('操作成功', 'ok');
    if (after) await after(data);
  } catch (e) {
    if (e.unauth) return;               // 失效提示已由 handleUnauth 给出
    alert('操作失败：' + e.message);
  }
}

/* ================================================================
 * 区块 3：通用工具（DOM / 转义 / 响应体兼容 / toast / modal / 分页）
 * ================================================================ */
function $(sel) { return document.querySelector(sel); }
function $id(id) { return document.getElementById(id); }

function esc(v) {
  return String(v === undefined || v === null ? '' : v).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
// 空值展示占位
function dash(v) { return (v === undefined || v === null || v === '') ? '—' : v; }
// 取列表（兼容 list / records / rows / 直接数组）
function pickList(d) {
  if (!d) return [];
  if (Array.isArray(d)) return d;
  const keys = ['list', 'records', 'rows', 'items', 'data'];
  for (let i = 0; i < keys.length; i++) if (Array.isArray(d[keys[i]])) return d[keys[i]];
  return [];
}
// 取总条数（兼容 count / total / totalCount / totalElements）
function pickTotal(d) {
  if (!d) return 0;
  if (Array.isArray(d)) return d.length;
  const keys = ['count', 'total', 'totalCount', 'totalElements'];
  for (let i = 0; i < keys.length; i++) {
    const v = d[keys[i]];
    if (typeof v === 'number') return v;
    if (typeof v === 'string' && v !== '' && !isNaN(Number(v))) return Number(v);
  }
  return 0;
}
// 数值兜底
function num(v, dft) { return (v === undefined || v === null || v === '' || isNaN(Number(v))) ? (dft === undefined ? 0 : dft) : Number(v); }

/** 轻提示 */
function toast(msg, type) {
  const box = $id('toast-box');
  const div = document.createElement('div');
  div.className = 'toast ' + (type === 'ok' ? 'ok' : type === 'err' ? 'err' : '');
  div.textContent = msg;
  box.appendChild(div);
  setTimeout(function () { if (div.parentNode) div.parentNode.removeChild(div); }, 2400);
}

/* ---------------- 自写 modal（遮罩 + 居中卡片，Esc 关闭） ---------------- */
let activeModal = null;

function openModal(title, bodyHtml, onConfirm, opts) {
  opts = opts || {};
  closeModal();
  const mask = document.createElement('div');
  mask.className = 'modal-mask';
  mask.innerHTML =
    '<div class="modal" role="dialog" aria-modal="true">' +
      '<div class="modal-head"><h3>' + esc(title) + '</h3>' +
        '<button type="button" class="icon-btn" data-modal-close aria-label="关闭">✕</button></div>' +
      '<form class="modal-body" id="modal-form" autocomplete="off">' + bodyHtml + '</form>' +
      '<div class="modal-foot">' +
        '<button type="button" class="btn" data-modal-close>取消</button>' +
        '<button type="button" class="btn btn-primary" id="modal-ok">' + esc(opts.okText || '保存') + '</button>' +
      '</div>' +
    '</div>';
  document.body.appendChild(mask);
  activeModal = mask;

  const form = mask.querySelector('#modal-form');
  const okBtn = mask.querySelector('#modal-ok');

  // 遮罩点击 / 关闭按钮
  mask.addEventListener('click', function (e) {
    if (e.target === mask || e.target.closest('[data-modal-close]')) closeModal();
  });
  // 表单回车提交（textarea 中回车不会触发表单提交）
  form.addEventListener('submit', function (e) { e.preventDefault(); okBtn.click(); });

  okBtn.addEventListener('click', async function () {
    const old = okBtn.textContent;
    okBtn.disabled = true; okBtn.textContent = '处理中…';
    try {
      const ret = await onConfirm(form, mask);
      if (ret !== false) closeModal();
    } catch (e) {
      if (!e.unauth) alert('操作失败：' + e.message);
    } finally {
      if (activeModal === mask) { okBtn.disabled = false; okBtn.textContent = old; }
    }
  });

  const first = form.querySelector('input:not([type=hidden]), select, textarea');
  if (first) first.focus();
}

function closeModal() {
  if (activeModal && activeModal.parentNode) activeModal.parentNode.removeChild(activeModal);
  activeModal = null;
}

/* ---------------- 表单控件片段 ---------------- */
function fieldText(name, label, value, ph) {
  return '<label class="field"><span>' + esc(label) + '</span>' +
    '<input name="' + name + '" value="' + esc(value) + '" placeholder="' + esc(ph || '') + '"></label>';
}
function fieldNum(name, label, value, ph) {
  return '<label class="field"><span>' + esc(label) + '</span>' +
    '<input name="' + name + '" type="number" value="' + esc(value) + '" placeholder="' + esc(ph || '') + '"></label>';
}
function fieldSelect(name, label, value, options) {
  return '<label class="field"><span>' + esc(label) + '</span><select name="' + name + '">' +
    options.map(function (o) {
      const sel = String(o.value) === String(value === undefined || value === null ? '' : value) ? ' selected' : '';
      return '<option value="' + esc(o.value) + '"' + sel + '>' + esc(o.label) + '</option>';
    }).join('') + '</select></label>';
}
// 是否 / 启用 通用选项
function boolOptions(v, onLabel, offLabel) {
  return [
    { value: '1', label: onLabel || '是' },
    { value: '0', label: offLabel || '否' }
  ].map(function (o) {
    const sel = String(num(v, 0)) === o.value ? ' selected' : '';
    return '<option value="' + o.value + '"' + sel + '>' + o.label + '</option>';
  }).join('');
}
// 新闻状态：0 待审 1 已发布 2 驳回
function newsStatusOptions(v, withAll) {
  const arr = withAll ? [{ value: '', label: '全部状态' }] : [];
  return arr.concat([
    { value: '0', label: '待审' },
    { value: '1', label: '已发布' },
    { value: '2', label: '驳回' }
  ]).map(function (o) {
    const sel = String(v === undefined || v === null ? '' : v) === o.value ? ' selected' : '';
    return '<option value="' + o.value + '"' + sel + '>' + o.label + '</option>';
  }).join('');
}
// 频道下拉
function categoryOptions(v, withAll) {
  const arr = withAll ? [{ value: '', label: '全部频道' }] : [];
  state.categories.forEach(function (c) { arr.push({ value: c.id, label: c.name }); });
  if (!state.categories.length) arr.push({ value: '', label: '（无频道数据）' });
  return arr.map(function (o) {
    const sel = String(v === undefined || v === null ? '' : v) === String(o.value) ? ' selected' : '';
    return '<option value="' + esc(o.value) + '"' + sel + '>' + esc(o.label) + '</option>';
  }).join('');
}
function catName(id, fallback) {
  if (fallback) return fallback;
  const hit = state.categories.filter(function (c) { return String(c.id) === String(id); })[0];
  return hit ? hit.name : dash(id);
}

/** 分页条：data-target 交给全局委托处理 */
function renderPager(container, target, page, size, total) {
  if (!container) return;
  const pages = Math.max(1, Math.ceil((Number(total) || 0) / size));
  container.innerHTML =
    '<button class="btn btn-sm" data-action="pager-prev" data-target="' + target + '"' + (page <= 1 ? ' disabled' : '') + '>上一页</button>' +
    '<span class="pager-info">第 ' + page + ' / ' + pages + ' 页 · 共 ' + (Number(total) || 0) + ' 条</span>' +
    '<button class="btn btn-sm" data-action="pager-next" data-target="' + target + '"' + (page >= pages ? ' disabled' : '') + '>下一页</button>';
}

/* ================================================================
 * 区块 4：登录 / 退出
 * ================================================================ */
function showLogin() {
  $id('app-view').classList.add('hidden');
  $id('login-view').classList.remove('hidden');
  state.page = '';
  const pwd = $id('login-password');
  if (pwd) pwd.value = '';
}

function enterApp() {
  $id('login-view').classList.add('hidden');
  $id('app-view').classList.remove('hidden');
  $id('top-nickname').textContent = state.nickname || '管理员';
  go('dashboard');
}

async function doLogin(e) {
  e.preventDefault();
  const mobile = $id('login-mobile').value.trim();
  const password = $id('login-password').value;
  const tip = $id('login-tip');
  const btn = $id('login-btn');
  tip.textContent = '';
  if (!mobile || !password) { tip.textContent = '请输入手机号与密码'; return; }

  btn.disabled = true; btn.textContent = '登录中…';
  try {
    // POST /admin/api/login  mobile + password
    const d = await api('POST', '/admin/api/login', { mobile: mobile, password: password });
    const token = d && d.token ? d.token : '';
    if (!token) throw new Error('登录响应缺少 token');
    state.token = token;
    state.nickname = (d && d.nickname) ? d.nickname : '管理员';
    localStorage.setItem(LS_TOKEN, state.token);
    localStorage.setItem(LS_NAME, state.nickname);
    enterApp();
    toast('登录成功，欢迎回来', 'ok');
  } catch (err) {
    tip.textContent = err.unauth ? '登录失败，请稍后重试' : ('登录失败：' + err.message);
  } finally {
    btn.disabled = false; btn.textContent = '登 录';
  }
}

function doLogout() {
  if (!confirm('确定要退出登录吗？')) return;
  state.token = '';
  localStorage.removeItem(LS_TOKEN);
  localStorage.removeItem(LS_NAME);
  state.built = {};
  ['dashboard', 'news', 'banner', 'source', 'logs', 'user'].forEach(function (p) {
    $id('page-' + p).innerHTML = '';
  });
  showLogin();
  toast('已退出登录', 'ok');
}

function go(page) {
  state.page = page;
  document.querySelectorAll('.nav-item').forEach(function (a) {
    a.classList.toggle('active', a.dataset.page === page);
  });
  document.querySelectorAll('.page').forEach(function (s) {
    s.classList.toggle('active', s.id === 'page-' + page);
  });
  $id('page-title').textContent = PAGE_TITLES[page] || '';
  loaders[page]();
}

async function loadCategories() {

  try {

async function loadDashboard() {

      { k: '待审',     v: d.pending,        c: 'amber' },
      { k: '已发布',   v: d.published,      c: 'green' },
      { k: 'AI 已摘要', v: d.aiDone,        c: 'green' },
      { k: 'AI 失败',  v: d.aiFailed,       c: 'red'   },
      { k: '今日新增', v: d.todayInserted,  c: 'blue'  },
      { k: '采集源',   v: d.sourceCount,    c: ''      },
      { k: '用户',     v: d.userCount,      c: ''      },
      { k: '评论',     v: d.commentCount,   c: ''      }
    ];

    const max = Math.max(1, dist.map(function (x) { return num(x.count, 0); }).concat([1]).reduce(function (a, b) { return Math.max(a, b); }));

    box.innerHTML =
      '<div class="cards">' + cards.map(function (c) {

        '<div class="panel-head"><h3>频道分布（categoryDist）</h3>' +
          '<span class="muted">共 ' + dist.length + ' 个频道</span></div>' +
        '<div class="bars">' + (dist.length ? dist.map(function (x) {
          const cnt = num(x.count, 0);
          const w = Math.max(2, Math.round(cnt / max * 100));
          return '<div class="bar-row">' +
                   '<div class="bar-name" title="' + esc(x.name) + '">' + esc(dash(x.name)) + '</div>' +
                   '<div class="bar-track"><div class="bar-fill" style="width:' + w + '%"></div></div>' +

                 '</div>';
        }).join('') : '<div class="muted" style="padding:12px 0">暂无数据</div>') + '</div>' +
      '</div>';
  } catch (e) {
    if (e.unauth) return;
    box.innerHTML = '<div class="panel"><div class="panel-body" style="color:#dc2626">加载失败：' + esc(e.message) + '</div></div>';
  }
}

  if (s === '0') return '<span class="badge badge-amber">待审</span>';
  if (s === '2') return '<span class="badge badge-red">驳回</span>';
  return '<span class="badge">未知</span>';

  if (s === '2') return '<span class="badge badge-red">失败</span>';
  return '<span class="badge">未处理</span>';
}

async function loadNews() {

  tbody.innerHTML = '<tr><td colspan="8" class="empty">加载中…</td></tr>';
  try {
    const f = st.filter;
    // GET /admin/api/news  status? category_id? keyword? ai_status? page_index page_size
    const d = await api('GET', '/admin/api/news', {
      status: f.status, category_id: f.category_id, keyword: f.keyword, ai_status: f.ai_status,
      page_index: st.page, page_size: st.size
    });
    st.list = pickList(d);
    st.total = pickTotal(d) || st.list.length;
    tbody.innerHTML = st.list.length
      ? st.list.map(newsRowHtml).join('')
      : '<tr><td colspan="8" class="empty">暂无数据</td></tr>';

    '<div class="grid-2">' +
      fieldNum('news_id', '关联新闻 ID', item.news_id, '可留空') +
      fieldNum('sort', '排序（越小越前）', num(item.sort, 0)) +
    '</div>' +
    fieldSelect('enable', '是否启用', num(item.enable, 1), [
      { value: '1', label: '启用' }, { value: '0', label: '停用' }
    ]);
  openModal(item.id ? ('编辑轮播 #' + item.id) : '新增轮播', body, async function (form) {
    const fd = new FormData(form);
    await api('POST', '/admin/api/banner/save', {
      id: item.id, title: fd.get('title'), image_url: fd.get('image_url'),
      link_url: fd.get('link_url'), news_id: fd.get('news_id'),
      sort: num(fd.get('sort'), 0), enable: fd.get('enable')
    });
    toast('保存成功', 'ok');
    await loadBanner();
  });
}

/* ================================================================
 * 区块 9：采集源管理
 * ================================================================ */
async function loadSource() {
  const box = $id('page-source');
  box.innerHTML = '<div class="panel"><div class="panel-body muted">加载中…</div></div>';
  let list = [];
  try {
    const d = await api('GET', '/admin/api/source');   // GET /admin/api/source
    list = pickList(d);
  } catch (e) {
    if (e.unauth) return;
    box.innerHTML = '<div class="panel"><div class="panel-body" style="color:#dc2626">加载失败：' + esc(e.message) + '</div></div>';
    return;
  }
  box.innerHTML =
    '<div class="panel">' +
      '<div class="panel-head"><h3>采集源列表</h3>' +
        '<button class="btn btn-primary btn-sm" data-action="source-add">新增采集源</button></div>' +
      '<div class="table-wrap"><table>' +
        '<thead><tr><th>ID</th><th>名称</th><th>适配器</th><th>列表 URL</th><th>关键词</th>' +
        '<th>最大页数</th><th>状态</th><th>最后采集时间</th><th>操作</th></tr></thead><tbody>' +
        (list.length ? list.map(function (s) {
          return '<tr>' +
            '<td>' + esc(s.id) + '</td>' +
            '<td class="nowrap">' + esc(dash(s.name)) + '</td>' +
            '<td class="nowrap">' + esc(dash(s.adapter)) + '</td>' +
            '<td><span class="trunc url" title="' + esc(s.list_url) + '">' + esc(dash(s.list_url)) + '</span></td>' +
            '<td><span class="trunc" style="max-width:160px" title="' + esc(s.keyword_filter) + '">' + esc(dash(s.keyword_filter)) + '</span></td>' +
            '<td>' + esc(dash(s.max_pages)) + '</td>' +
            '<td>' + (String(num(s.enable, 0)) === '1'
                        ? '<span class="badge badge-green">启用</span>'
                        : '<span class="badge">停用</span>') + '</td>' +
            '<td class="nowrap">' + esc(dash(s.last_crawl_time)) + '</td>' +
            '<td class="op">' +
              '<button class="btn btn-sm" data-action="source-edit" data-id="' + esc(s.id) + '">编辑</button> ' +
              '<button class="btn btn-sm btn-danger" data-action="source-delete" data-id="' + esc(s.id) + '">删除</button>' +
            '</td></tr>';
        }).join('') : '<tr><td colspan="9" class="empty">暂无数据</td></tr>') +
      '</tbody></table></div>' +
    '</div>';
  box.__list = list;
}

function openSourceEditor(item) {
  item = item || {};
  const body =
    '<input type="hidden" name="id" value="' + esc(item.id) + '">' +
    '<div class="grid-2">' +
      fieldText('name', '名称', item.name) +
      fieldText('adapter', '适配器 adapter', item.adapter, '如 wuhu_kjj') +
      fieldText('default_category_code', '默认频道编码', item.default_category_code) +
      fieldText('keyword_filter', '关键词过滤', item.keyword_filter, '多个关键词用逗号分隔') +
      fieldNum('max_pages', '最大页数', num(item.max_pages, 1)) +
      fieldNum('sort', '排序', num(item.sort, 0)) +
      fieldSelect('enable', '是否启用', num(item.enable, 1), [
        { value: '1', label: '启用' }, { value: '0', label: '停用' }
      ]) +
    '</div>' +
    fieldText('list_url', '列表 URL', item.list_url, '填写列表页地址') +
    fieldText('remark', '备注', item.remark);
  openModal(item.id ? ('编辑采集源 #' + item.id) : '新增采集源', body, async function (form) {
    const fd = new FormData(form);
    await api('POST', '/admin/api/source/save', {
      id: item.id, name: fd.get('name'), adapter: fd.get('adapter'),
      list_url: fd.get('list_url'), default_category_code: fd.get('default_category_code'),
      keyword_filter: fd.get('keyword_filter'), max_pages: num(fd.get('max_pages'), 1),
      enable: fd.get('enable'), sort: num(fd.get('sort'), 0), remark: fd.get('remark')
    });
    toast('保存成功', 'ok');
    await loadSource();
  });
}

/* ================================================================
 * 区块 10：采集日志（GET /admin/api/crawl/logs）
 * ================================================================ */
function ensureLogsPage() {
  if (state.built.logs) return;
  state.built.logs = true;
  $id('page-logs').innerHTML =
    '<div class="panel">' +
      '<div class="panel-head"><h3>采集日志</h3>' +
        '<button class="btn btn-sm" data-action="logs-refresh">刷新</button></div>' +
      '<div class="table-wrap"><table>' +
        '<thead><tr><th>时间</th><th>源名</th><th>抓取</th><th>新增</th><th>重复</th>' +
        '<th>过滤</th><th>状态</th><th>耗时</th><th>消息</th></tr></thead>' +
        '<tbody id="logs-tbody"></tbody>' +
      '</table></div>' +
      '<div class="pager" id="logs-pager"></div>' +
    '</div>';
}

function logField(row, keys) {
  for (let i = 0; i < keys.length; i++) {
    const v = row[keys[i]];
    if (v !== undefined && v !== null && v !== '') return v;
  }
  return '';
}

async function loadLogs() {
  const st = state.logs;
  const tbody = $id('logs-tbody');
  if (!tbody) return;
  tbody.innerHTML = '<tr><td colspan="9" class="empty">加载中…</td></tr>';
  try {
    // GET /admin/api/crawl/logs  page_index page_size
    const d = await api('GET', '/admin/api/crawl/logs', { page_index: st.page, page_size: st.size });
    st.list = pickList(d);
    st.total = pickTotal(d) || st.list.length;
    tbody.innerHTML = st.list.length ? st.list.map(function (r) {
      const status = String(num(logField(r, ['status']), 1));
      const dur = logField(r, ['duration_ms', 'duration']);
      return '<tr>' +
        '<td class="nowrap">' + esc(dash(logField(r, ['create_time', 'crawl_time', 'time', 'createTime']))) + '</td>' +
        '<td class="nowrap">' + esc(dash(logField(r, ['source_name', 'sourceName', 'name']))) + '</td>' +
        '<td>' + esc(num(logField(r, ['total', 'total_count']), 0)) + '</td>' +
        '<td>' + esc(num(logField(r, ['inserted', 'insert_count']), 0)) + '</td>' +
        '<td>' + esc(num(logField(r, ['duplicated', 'dup_count']), 0)) + '</td>' +
        '<td>' + esc(num(logField(r, ['filtered', 'filter_count']), 0)) + '</td>' +
        '<td>' + (status === '1' ? '<span class="badge badge-green">成功</span>'
                                 : '<span class="badge badge-red">失败</span>') + '</td>' +
        '<td class="nowrap">' + (dur === '' ? '—' : esc(dur) + ' ms') + '</td>' +
        '<td><span class="trunc" style="max-width:260px" title="' + esc(logField(r, ['message', 'msg'])) + '">' +
          esc(dash(logField(r, ['message', 'msg']))) + '</span></td>' +
      '</tr>';
    }).join('') : '<tr><td colspan="9" class="empty">暂无数据</td></tr>';
    renderPager($id('logs-pager'), 'logs', st.page, st.size, st.total);
  } catch (e) {
    if (e.unauth) return;
    tbody.innerHTML = '<tr><td colspan="9" class="empty">加载失败：' + esc(e.message) + '</td></tr>';
  }
}

/* ================================================================
 * 区块 11：用户管理（GET /admin/api/user、POST /admin/api/user/enable）
 * ================================================================ */
function ensureUserPage() {
  if (state.built.user) return;
  state.built.user = true;
  $id('page-user').innerHTML =
    '<div class="panel"><div class="toolbar">' +
      '<input id="u-keyword" style="width:200px" placeholder="昵称 / 手机号关键词">' +
      '<button class="btn btn-primary" data-action="user-search">查询</button>' +
      '<button class="btn" data-action="user-reset">重置</button>' +
    '</div></div>' +
    '<div class="panel">' +
      '<div class="panel-head"><h3>用户列表</h3><span class="muted" id="user-total"></span></div>' +
      '<div class="table-wrap"><table>' +
        '<thead><tr><th>ID</th><th>昵称</th><th>手机号</th><th>头像</th><th>状态</th><th>注册时间</th><th>操作</th></tr></thead>' +
        '<tbody id="user-tbody"></tbody>' +
      '</table></div>' +
      '<div class="pager" id="user-pager"></div>' +
    '</div>';
}

async function loadUsers() {
  const st = state.users;
  const tbody = $id('user-tbody');
  if (!tbody) return;
  tbody.innerHTML = '<tr><td colspan="7" class="empty">加载中…</td></tr>';
  try {
    // GET /admin/api/user  keyword? page_index page_size
    const d = await api('GET', '/admin/api/user', { keyword: st.keyword, page_index: st.page, page_size: st.size });
    st.list = pickList(d);
    st.total = pickTotal(d) || st.list.length;
    tbody.innerHTML = st.list.length ? st.list.map(function (u) {
      const enable = num(logField(u, ['enable', 'status']), 1);
      return '<tr>' +
        '<td>' + esc(u.id) + '</td>' +
        '<td class="nowrap">' + esc(dash(u.nickname)) + '</td>' +
        '<td class="nowrap">' + esc(dash(u.mobile)) + '</td>' +
        '<td><span class="trunc url" title="' + esc(u.avatar_url) + '">' + esc(dash(u.avatar_url)) + '</span></td>' +
        '<td>' + (enable === 1 ? '<span class="badge badge-green">启用</span>'
                               : '<span class="badge badge-red">禁用</span>') + '</td>' +
        '<td class="nowrap">' + esc(dash(logField(u, ['create_time', 'createTime']))) + '</td>' +
        '<td class="op">' +
          '<button class="btn btn-sm" data-action="user-enable" data-id="' + esc(u.id) + '" data-val="' + (enable === 1 ? '0' : '1') + '">' +
            (enable === 1 ? '禁用' : '启用') + '</button>' +
        '</td></tr>';
    }).join('') : '<tr><td colspan="7" class="empty">暂无数据</td></tr>';
    $id('user-total').textContent = '共 ' + st.total + ' 条';
    renderPager($id('user-pager'), 'users', st.page, st.size, st.total);
  } catch (e) {
    if (e.unauth) return;
    tbody.innerHTML = '<tr><td colspan="7" class="empty">加载失败：' + esc(e.message) + '</td></tr>';
  }
}

/* ================================================================
 * 区块 12：全局事件委托 + 初始化
 * ================================================================ */
async function onAction(btn) {
  const action = btn.dataset.action;
  const id = btn.dataset.id;
  const val = btn.dataset.val;

  switch (action) {
    /* ---------- 导航 / 登录 ---------- */
    case 'nav':
      go(btn.dataset.page);
      break;
    case 'logout':
      doLogout();
      break;

    /* ---------- 分页 ---------- */
    case 'pager-prev':
    case 'pager-next': {
      const target = btn.dataset.target;
      const st = target === 'news' ? state.news : target === 'logs' ? state.logs : state.users;
      const pages = Math.max(1, Math.ceil((Number(st.total) || 0) / st.size));
      const np = Math.min(pages, Math.max(1, st.page + (action === 'pager-prev' ? -1 : 1)));
      if (np === st.page) return;
      st.page = np;
      if (target === 'news') await loadNews();
      else if (target === 'logs') await loadLogs();
      else await loadUsers();
      break;
    }

    /* ---------- 新闻管理 ---------- */
    case 'news-search': {
      state.news.filter = {
        status: $id('f-status').value,
        category_id: $id('f-category').value,
        ai_status: $id('f-ai').value,
        keyword: $id('f-keyword').value.trim()
      };
      state.news.page = 1;
      await loadNews();
      break;
    }
    case 'news-reset':
      $id('f-status').value = '';
      $id('f-category').value = '';
      $id('f-ai').value = '';
      $id('f-keyword').value = '';
      state.news.filter = { status: '', category_id: '', ai_status: '', keyword: '' };
      state.news.page = 1;
      await loadNews();
      break;
    case 'news-edit':
      await openNewsEditor(id);
      break;
    case 'news-audit': {
      const label = val === '1' ? '通过' : '驳回';
      const row = findNews(id);
      await writeOp('确定要' + label + '新闻「' + (row.title || id) + '」吗？', function () {
        // POST /admin/api/news/audit  id, status
        return api('POST', '/admin/api/news/audit', { id: id, status: val });
      }, loadNews);
      break;
    }
    case 'news-delete': {
      const row = findNews(id);
      await writeOp('确定要删除新闻「' + (row.title || id) + '」吗？删除后不可恢复！', function () {
        // POST /admin/api/news/delete  id
        return api('POST', '/admin/api/news/delete', { id: id });
      }, loadNews);
      break;
    }
    case 'news-slider': {
      const row = findNews(id);
      const toSlider = val === '1';
      await writeOp('确定要' + (toSlider ? '设为轮播' : '取消轮播') + '：「' + (row.title || id) + '」吗？', async function () {
        // 走 news/save 带 slider 参数，需要完整字段 → 先取详情
        let detail = row;
        try {
          const d = await api('GET', '/admin/api/news/' + encodeURIComponent(id));
          if (d && typeof d === 'object') detail = Object.assign({}, row, d);
        } catch (e) { if (e.unauth) throw e; }
        // POST /admin/api/news/save
        return api('POST', '/admin/api/news/save', {
          id: id,
          title: detail.title,
          content: detail.content,
          category_id: detail.category_id,
          origin: detail.origin,
          photo_url: detail.photo_url,
          status: num(detail.status, 0),
          slider: toSlider ? 1 : 0
        });
      }, loadNews);
      break;
    }
    case 'ai-regenerate': {
      const row = findNews(id);
      await writeOp('确定要重新生成「' + (row.title || id) + '」的 AI 摘要吗？', function () {
        // POST /admin/api/ai/regenerate?id=
        return api('POST', '/admin/api/ai/regenerate', { id: id }, { query: true });
      }, loadNews);
      break;
    }
    case 'ai-backfill':
      await writeOp('确定要批量补齐 5 条新闻的 AI 摘要吗？（耗时较长）', function () {
        // POST /admin/api/ai/backfill?limit=5
        return api('POST', '/admin/api/ai/backfill', { limit: 5 }, { query: true });
      }, async function (data) {
        let n = data;
        if (data && typeof data === 'object') n = (data.count !== undefined ? data.count
                                             : data.processed !== undefined ? data.processed
                                             : JSON.stringify(data));
        alert('本次处理条数：' + n);
        await loadNews();
      });
      break;

    /* ---------- 轮播管理 ---------- */
    case 'banner-add':
      openBannerEditor({ sort: 0, enable: 1 });
      break;
    case 'banner-edit': {
      const list = $id('page-banner').__list || [];
      openBannerEditor(list.filter(function (x) { return String(x.id) === String(id); })[0] || { id: id });
      break;
    }
    case 'banner-delete':
      await writeOp('确定要删除该轮播（ID=' + id + '）吗？', function () {
        // POST /admin/api/banner/delete  id
        return api('POST', '/admin/api/banner/delete', { id: id });
      }, loadBanner);
      break;

    case 'banner-regen':
      await writeOp('将按数据库标题重新绘制全部启用中的轮播图（1500×640，与滑动框同比例），确定继续？', function () {
        // POST /admin/api/banner/regenerate
        return api('POST', '/admin/api/banner/regenerate', {}, { query: true });
      }, async function (data) {
        let msg = '生成完成';
        if (data && typeof data === 'object') {
          msg = '成功 ' + (data.success || 0) + ' 张';
          if (data.skipped) msg += '，跳过 ' + data.skipped + ' 张（未启用）';
          if (data.messages && data.messages.length) msg += '\n' + data.messages.join('\n');
        }
        alert(msg);
        await loadBanner();
      });
      break;

    /* ---------- 采集源 ---------- */
    case 'source-add':
      openSourceEditor({ enable: 1, max_pages: 1, sort: 0 });
      break;
    case 'source-edit': {
      const list = $id('page-source').__list || [];
      openSourceEditor(list.filter(function (x) { return String(x.id) === String(id); })[0] || { id: id });
      break;
    }
    case 'source-delete':
      await writeOp('确定要删除该采集源（ID=' + id + '）吗？', function () {
        // POST /admin/api/source/delete  id
        return api('POST', '/admin/api/source/delete', { id: id });
      }, loadSource);
      break;

    /* ---------- 采集日志 ---------- */
    case 'logs-refresh':
      await loadLogs();
      break;

    /* ---------- 用户管理 ---------- */
    case 'user-search':
      state.users.keyword = $id('u-keyword').value.trim();
      state.users.page = 1;
      await loadUsers();
      break;
    case 'user-reset':
      $id('u-keyword').value = '';
      state.users.keyword = '';
      state.users.page = 1;
      await loadUsers();
      break;
    case 'user-enable': {
      const list = state.users.list || [];
      const u = list.filter(function (x) { return String(x.id) === String(id); })[0] || {};
      const toEnable = val === '1';
      await writeOp('确定要' + (toEnable ? '启用' : '禁用') + '用户「' + (u.nickname || id) + '」吗？', function () {
        // POST /admin/api/user/enable  id, enable
        return api('POST', '/admin/api/user/enable', { id: id, enable: val });
      }, loadUsers);
      break;
    }
  }
}

function bindGlobal() {
  // 统一事件委托：所有按钮通过 data-action 分发
  document.addEventListener('click', function (e) {
    const t = e.target;
    if (!t || typeof t.closest !== 'function') return;
    const btn = t.closest('[data-action]');
    if (!btn || btn.disabled) return;
    if (btn.tagName === 'A') e.preventDefault();
    Promise.resolve(onAction(btn)).catch(function (err) {
      if (!err || !err.unauth) console.error(err);
    });
  });

  // Esc 关闭弹窗
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && activeModal) closeModal();
  });

  // 登录表单
  $id('login-form').addEventListener('submit', doLogin);

  // 列表筛选框回车即查询
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return;
    const t = e.target;
    if (!t || t.tagName !== 'INPUT') return;
    if (t.id === 'f-keyword') { const b = document.querySelector('[data-action="news-search"]'); if (b) b.click(); }
    if (t.id === 'u-keyword') { const b = document.querySelector('[data-action="user-search"]'); if (b) b.click(); }
  });
}

(function init() {
  bindGlobal();
  if (state.token) enterApp();   // 有 token 直接进主界面（首次请求若 401 会自动回登录页）
  else showLogin();
})();
</script>
