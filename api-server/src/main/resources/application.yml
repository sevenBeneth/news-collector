server:
  port: 9533
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  # ---------- 数据库 ----------
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/news_collector?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  # ---------- JSON 序列化 ----------
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    serialization:
      write-dates-as-timestamps: false
      indent_output: true

# ---------- MyBatis ----------
mybatis:
  typeAliasesPackage: com.wuhu.news.entity
  mapper-locations: mapper/*.xml
  configuration:
    map-underscore-to-camel-case: false

# ---------- 通用 Mapper ----------
mapper:
  mappers:
    - com.wuhu.news.utils.MyBaseMapper
  not-empty: false
  identity: MYSQL

pagehelper:
  helper-dialect: mysql
  reasonable: true

# ---------- 业务配置 ----------
app:
  # 采集端调用 /api/ingest/** 所需的令牌
  ingest-token: wuhu-ingest-2026
  admin:
    mobile: 13800000001
    password: admin123
    nickname: 管理员
  demo-user:
    mobile: 13800000000
    password: 123456
    nickname: 演示用户

# ---------- DeepSeek 大模型 ----------
ai:
  deepseek:
    enabled: true
    base-url: https://api.deepseek.com
    # 优先读取环境变量 DEEPSEEK_API_KEY，便于部署时替换
    key: ${DEEPSEEK_API_KEY:REMOVED-BY-SECURITY-SCRUB}
    model: deepseek-chat
    connect-timeout: 10000
    read-timeout: 90000
    temperature: 0.2
    max-tokens: 900
    # 单次批量补齐的最大条数
    batch-limit: 5

# ---------- 日志 ----------
logging:
  level:
    root: warn
    com.wuhu.news: info
    org.springframework: warn
